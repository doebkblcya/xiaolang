name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm test
      - run: docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t xiaolang:check -t "xiaolang:$GITHUB_SHA" .
      - name: Load an external plugin in the built container without network access
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" --entrypoint node \
            -v "$GITHUB_WORKSPACE/dist/plugins:/app/plugins:rw" \
            -v "$GITHUB_WORKSPACE/config.example.json:/app/config.example.json:ro" \
            -v "$GITHUB_WORKSPACE/test/container-smoke.mjs:/smoke.mjs:ro" \
            xiaolang:check /smoke.mjs
      - name: Export the verified Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/xiaolang-image"
          docker save "xiaolang:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/xiaolang-image/xiaolang-linux-amd64.tar.gz"
          tar -czf "$RUNNER_TEMP/xiaolang-image/xiaolang-plugins.tar.gz" -C dist/plugins .
          cd "$RUNNER_TEMP/xiaolang-image"
          sha256sum xiaolang-linux-amd64.tar.gz xiaolang-plugins.tar.gz > SHA256SUMS
      - name: Upload the Docker image archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: xiaolang-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/xiaolang-image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
