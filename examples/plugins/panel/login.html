<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小狼 · 访问验证</title><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body class="login-page"><main class="login-main"><form id="access-form" class="panel">
  <p class="eyebrow">小狼控制台</p><h1>访问验证</h1><p class="muted">输入你的访问 Key，进入管理面板。</p>
  <label class="field">访问 Key<input id="access-key" name="key" type="password" required minlength="32" maxlength="512" autocomplete="current-password" spellcheck="false" autofocus></label>
  <p id="access-message" class="muted" role="status">Key 仅用于本次验证，不会保存在网页中。</p>
  <button id="access-submit" class="primary" type="submit">进入面板</button>
</form></main></body></html>
